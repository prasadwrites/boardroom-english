<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Accounts · Boardroom English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/*TOKENS*/
body { margin: 0; }
[hidden] { display: none !important; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 20px 16px; }
.top h1 { font-size: 1.5rem; }
.top h1 a { color: inherit; text-decoration: none; }
.top h1 span { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); padding: 0 2px; }
.top-right { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.top .who { font-size: .85rem; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: .86rem; color: var(--ink); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
h2 { font-size: 1.2rem; margin: 8px 0 4px; }
.lede { color: var(--muted); margin: 0 0 16px; font-size: .92rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1.1; }
.stat span { font-size: .8rem; color: var(--muted); }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tools input, .tools select { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 11px; background: var(--surface); font: inherit; color: inherit; min-width: 0; }
.tools input { flex: 1 1 220px; }
.list { display: grid; gap: 10px; }
.acct { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.3fr) auto; gap: 14px 18px; align-items: center; }
.acct.off { opacity: .75; }
.acct .id { min-width: 0; }
.acct .email { font-weight: 600; overflow-wrap: anywhere; }
.acct .meta { font-size: .78rem; color: var(--muted); }
.badge { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
.badge.admin { background: var(--rule); color: var(--accent); }
.badge.off { background: var(--bad-bg); color: var(--bad); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field select, .field input { border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); font: inherit; color: inherit; width: 100%; min-width: 0; }
.usage { font-size: .78rem; color: var(--muted); }
.usage b { color: var(--ink); font-weight: 600; }
.code-row { display: flex; gap: 6px; }
.code-row input { flex: 1; font-family: var(--mono); font-size: .85rem; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 14px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; font-weight: 600; color: var(--muted); margin-bottom: -1px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.acct { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr) auto; }
.deck-row { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; }
.badge.swipe { background: #EDE4FF; color: #4B2F8F; }
.badge.pub { background: var(--good-bg); color: var(--good); }
.meta.warn { color: var(--bad); }
.field > label:has(input[type="checkbox"]) { text-transform: none; letter-spacing: 0; font-size: .88rem; color: var(--ink); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.field input[type="checkbox"], .who-list input { width: auto; }
.assign summary { cursor: pointer; font-size: .88rem; font-weight: 600; }
.who-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; padding: 8px 2px 2px; font-size: .86rem; }
.who-list label { display: flex; gap: 8px; align-items: center; overflow-wrap: anywhere; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: .86rem; color: var(--ink); }
.notice { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 22px; }
.notice p { margin: 0 0 12px; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: .88rem; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.btn, .tab { transition: border-color .15s, color .15s, transform .12s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.acct { transition: transform .2s ease, box-shadow .2s ease; }
@media (prefers-reduced-motion: no-preference) {
  .top h1 span { background-size: 0% 100%; background-repeat: no-repeat; animation: sweep .9s .2s cubic-bezier(.3,.8,.3,1) forwards; }
  @keyframes sweep { to { background-size: 100% 100%; } }
  .enter .stat, .enter .acct, .enter .lede, .enter .tools { animation: rise .4s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(min(var(--i, 0), 12) * 35ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .acct:hover { transform: translateY(-2px); }
  #toast:not([hidden]) { animation: toastin .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes toastin { from { opacity: 0; transform: translate(-50%, 14px); } }
}
@media (max-width: 900px) {
  .acct, .deck-row { grid-template-columns: minmax(0, 1fr); }
  .acct .act .btn { width: 100%; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="/">Boardroom <span>English</span></a></h1>
    <span class="top-right"><span class="who" id="who"></span><a class="btn" href="/">← Back to decks</a></span>
  </header>
  <main id="main"><p class="lede">Loading accounts…</p></main>
</div>
<div id="toast" hidden></div>
<script type="module" src="/admin.js"></script>
</body>
</html>

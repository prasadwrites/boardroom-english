name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The service-account key is stored as a secret of this GitHub environment.
    environment: FIREBASE_SERVICE_ACCOUNT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: functions
      - run: node scripts/build.mjs
      - name: Check Firebase credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_AS_VARIABLE: ${{ vars.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "Saved as a variable instead of a secret: $SA_AS_VARIABLE"
          if [ -z "$SA" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is empty or not visible to this workflow. Add it under Settings > Environments > FIREBASE_SERVICE_ACCOUNT > Environment secrets."
            exit 1
          fi
          printf '%s' "$SA" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);if(j.type!=="service_account"||!j.private_key)throw new Error("not a service-account key");console.log("Service account key found for "+j.project_id)}catch(e){console.log("::error::FIREBASE_SERVICE_ACCOUNT is set ("+s.length+" chars) but is not a valid service-account JSON key: "+e.message);process.exit(1)}})'
      - name: Write credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${{ vars.FIREBASE_PROJECT_ID || 'boardroom-english' }}" --non-interactive --force
      - name: Store function secrets in Secret Manager
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GENERATE_ACCESS_CODE: ${{ secrets.GENERATE_ACCESS_CODE }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'boardroom-english' }}
        run: |
          set_secret() {
            printf '%s' "$2" | npx --yes firebase-tools@latest functions:secrets:set "$1" --data-file=- --project "$PROJECT" --non-interactive --force
          }
          if [ -n "$ANTHROPIC_API_KEY" ]; then set_secret ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; else echo "ANTHROPIC_API_KEY not set in GitHub; keeping the existing value in Secret Manager"; fi
          set_secret GENERATE_ACCESS_CODE "${GENERATE_ACCESS_CODE:-off}"
      - name: Deploy functions (deck generator)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@latest deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID || 'boardroom-english' }}" --non-interactive --force
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
